<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#f6f7f9">
  <title>{{ page.title | escape }} - {{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/img/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/pwa/manifest.json' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/writer.css' | relative_url }}">
</head>
<body>
  <nav class="writer-nav" aria-label="主导航">
    <a href="{{ '/' | relative_url }}">← 返回博客</a>
  </nav>
  {{ content }}
  <script src="{{ '/js/writer.js' | relative_url }}" defer></script>
</body>
</html>
